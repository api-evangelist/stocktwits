name: StockTwits
description: 'StockTwits is a social network for investors and traders, letting members
  share ideas (twits), follow tickers and people, build watchlists, and read real-time
  streams of market sentiment. The StockTwits API (v2) exposes this Social Finance graph
  over a REST/JSON interface at api.stocktwits.com/api/2: symbol/user/home/trending
  message streams, message create and like, symbol and user search, the social graph
  (followers/following), watchlist management, account verification, and deletion feeds.
  Authentication is OAuth 2.0 (authorization code) with app-level access tokens for
  public endpoints. StockTwits also publishes embeddable widgets, buttons, and message
  embeds for adding a Social Finance layer to any site. Sector: fintech; backed by
  Foundry Group.'
